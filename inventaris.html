</h1>

            </a>
        </div>

            

        </div>

    </header>

    <!-- Hoofdinhoud -->
    <main class="w3-app-main">

        <section class="w3-container w3-padding">
            <h2>Inventaris</h2>
            <p>Bekijk en beheer alle spullen die je hebt opgeslagen.</p>
        </section>

        <!-- Zoeken en filteren -->
        <section class="w3-container w3-padding">

            <div class="w3-inventory-search">

                <label for="zoek-spul">Zoeken</label>

                <input
                    class="w3-input w3-border w3-round"
                    type="search"
                    id="zoek-spul"
                    placeholder="Zoek een voorwerp..."
                >

                <label for="filter-categorie">Categorie</label>

                <select
                    class="w3-select w3-border w3-round"
                    id="filter-categorie"
                >
                    <option value="">Alle categorieën</option>
                    <option value="Kerst">Kerst</option>
                    <option value="Kamperen">Kamperen</option>
                    <option value="Gereedschap">Gereedschap</option>
                    <option value="Elektronica">Elektronica</option>
                    <option value="Overig">Overig</option>
                </select>

            </div>

        </section>

        <!-- Inventaris overzicht -->
        <section class="w3-container w3-padding">

            <div class="w3-inventory-heading">
                <h3>Alle spullen</h3>

                <a href="toevoegen.html"
                   class="w3-button w3-round-large w3-inventory-button">
                    + Spul toevoegen
                </a>
            </div>

                <div id="spullen-overzicht">

                </div>

            </div>

        </section>

    </main>
