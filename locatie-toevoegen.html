    <!-- Hoofdinhoud -->
    <main class="w3-app-main">

        <section class="w3-container w3-padding">
            <h2>Locatie toevoegen</h2>
            <p>Voeg een nieuwe opbergplek toe aan je inventaris.</p>
        </section>

        <!-- Formulier -->
        <section class="w3-container w3-padding">

            <div class="w3-location-form w3-card w3-white w3-round-large">

                <form id="locatie-form">

                    <div class="w3-location-field">
                        <label for="locatie-naam">Naam van de locatie *</label>

                        <input
                            class="w3-input w3-border w3-round"
                            type="text"
                            id="locatie-naam"
                            name="locatie-naam"
                            placeholder="Bijvoorbeeld: Garage"
                            required
                        >
                    </div>

                    <div class="w3-location-field">
                        <label for="locatie-type">Soort locatie *</label>

                        <select
                            class="w3-select w3-border w3-round"
                            id="locatie-type"
                            name="locatie-type"
                            required
                        >
                            <option value="" disabled selected>
                                Kies een soort locatie
                            </option>
                            <option value="Garage">Keuken</option>
                            <option value="Garage">Bijkeuken</option>
                            <option value="Garage">Woonkamer</option>
                            <option value="Garage">Kinderkamer</option>
                            <option value="Garage">Garage</option>
                            <option value="Zolder">Zolder</option>
                            <option value="Schuur">Schuur</option>
                            <option value="Berging">Berging</option>
                            <option value="Kelder">Kelder</option>
                            <option value="Overig">Overig</option>
                        </select>
                    </div>

                    <div class="w3-location-field">
                        <label for="locatie-beschrijving">Beschrijving</label>

                        <textarea
                            class="w3-input w3-border w3-round"
                            id="locatie-beschrijving"
                            name="locatie-beschrijving"
                            rows="4"
                            placeholder="Extra informatie over deze opbergplek..."
                        ></textarea>
                    </div>

                    <div class="w3-location-field">
                        <label for="locatie-ruimte">Ruimte of verdieping</label>

                        <input
                            class="w3-input w3-border w3-round"
                            type="text"
                            id="locatie-ruimte"
                            name="locatie-ruimte"
                            placeholder="Bijvoorbeeld: Eerste verdieping"
                        >
                    </div>

                    <p class="w3-location-required">
                        * Verplichte velden
                    </p>

                    <button
                        type="submit"
                        class="w3-button w3-round-large w3-location-button"
                    >
                        Locatie toevoegen
                    </button>

                    <a
                        href="locaties.html"
                        class="w3-button w3-round-large w3-location-cancel"
                    >
                        Annuleren
                    </a>

                </form>

            </div>

        </section>

    </main>
