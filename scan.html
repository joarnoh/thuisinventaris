            <h2>QR-code scannen</h2>

            <p>
                Scan de QR-code van een voorwerp
                in versie 1.2 komt qr genereren erbij!
                
            </p>

            <!-- Scanner container -->
            <div class="w3-container w3-white w3-border w3-round-large w3-padding-32 w3-empty-state w3-scan-container">

                <div class="w3-jumbo">▦</div>

                <h3>QR-scanner</h3>

                <p>
                    Richt je camera op de QR-code
                    van het voorwerp.
                </p>

                <button class="w3-button w3-brown w3-round-large">
                    Camera openen
                </button>

            </div>

        </section>
