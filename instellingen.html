        <section class="w3-container w3-padding w3-center">
            <h2>Instellingen</h2>
            <p>Beheer hier je account en algemene instellingen.</p>
        </section>

        <section class="w3-container w3-padding">

            <div class="w3-container w3-white w3-card w3-border w3-round-large w3-padding w3-margin-bottom">

                <h3>Account</h3>
                <p>Beheer je accountgegevens.</p>

                <a href="profiel.html" class="w3-button w3-brown w3-round-large">
                    Account bekijken
                </a>

            </div>

            <div class="w3-container w3-white w3-card w3-border w3-round-large w3-padding w3-margin-bottom">

                <h3>Website-informatie</h3>
                <p>Thuisinventaris versie 1.1 (release)</p>

            </div>

            <div class="w3-container w3-white w3-card w3-border w3-round-large w3-padding w3-margin-bottom">

                <h3>Uitloggen</h3>
                <p>Log uit bij je account.</p>

                <button id="uitlog-knop" class="w3-button w3-brown w3-round-large">
                    Uitloggen
                </button>

            </div>

        </section>

    </main>

    <script>
        const uitlogKnop = document.getElementById("uitlog-knop");

        uitlogKnop.addEventListener("click", function() {

            const bevestiging = confirm("Weet je zeker dat je wilt uitloggen?");

            if (bevestiging) {
                localStorage.removeItem("thuisinventaris-ingelogd");

                window.location.href = "login.html";
            }

        });
    </script>

    <!-- Zet dit in je <head> -->
<link rel="stylesheet" href="logout-modal.css" />

<!-- Je bestaande uitlogknop ergens in je pagina -->
<button id="logoutBtn" class="logout-btn" type="button">Uitloggen</button>

<!-- Zet dit vlak voor </body> -->
<div id="logoutModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <h2 id="modalTitle">Weet je het zeker?</h2>
    <div class="modal-actions">
      <button id="confirmLogoutBtn" class="btn-yes" type="button">Ja</button>
      <button id="cancelLogoutBtn" class="btn-no" type="button">Nee</button>
    </div>
  </div>
</div>

<script src="logout-modal.js"></script>
